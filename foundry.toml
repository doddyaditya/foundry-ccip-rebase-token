[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts@5.1.0/=lib/openzeppelin-contracts-5.1.0/contracts/",
    "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts/",
    "@openzeppelin/contracts@4.8.3/=lib/openzeppelin-contracts-4.8.3/contracts/",
    "@ccip/=lib/chainlink-ccip/chains/evm",
    "@chainlink-local/=lib/chainlink-local/",
    "@chainlink/contracts/=lib/chainlink-local/lib/ccip/contracts",
]

[profile.solx]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "/usr/local/bin/solx"
remappings = [
    "@openzeppelin/contracts@5.1.0/=lib/openzeppelin-contracts-5.1.0/contracts/",
    "@openzeppelin/contracts@5.0.2/=lib/openzeppelin-contracts-5.0.2/contracts/",
    "@openzeppelin/contracts@4.8.3/=lib/openzeppelin-contracts-4.8.3/contracts/",
    "@ccip/=lib/chainlink-ccip/chains/evm",
    "@chainlink-local/=lib/chainlink-local/",
    "@chainlink/contracts/=lib/chainlink-local/lib/ccip/contracts",

]


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
